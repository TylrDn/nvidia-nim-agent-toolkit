# NIM model endpoint configuration
# Swap model IDs here without touching Python code

default_model: meta/llama-3.1-70b-instruct

models:
  llama3_70b:
    id: meta/llama-3.1-70b-instruct
    context_length: 128000
    supports_tools: true
    recommended_for: [planner, reviewer, sql_agent]

  llama3_8b:
    id: meta/llama-3.1-8b-instruct
    context_length: 128000
    supports_tools: true
    recommended_for: [executor, doc_agent]

  mistral_nemo:
    id: mistralai/mistral-nemo-12b-instruct
    context_length: 128000
    supports_tools: true
    recommended_for: [api_agent]

  mixtral:
    id: mistralai/mixtral-8x22b-instruct-v0.1
    context_length: 64000
    supports_tools: false
    recommended_for: [summarization]

  embedding:
    id: nvidia/nv-embedqa-e5-v5
    type: embedding
    dimensions: 1024

  reranker:
    id: nvidia/nv-rerankqa-mistral-4b-v3
    type: reranker

endpoints:
  nim_cloud: https://integrate.api.nvidia.com/v1
  nim_local: http://localhost:8000/v1
