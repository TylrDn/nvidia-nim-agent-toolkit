# NIM model endpoint configurations
# Swap the active model without touching Python code.

default_model: meta/llama-3.1-8b-instruct

models:
  llama3_8b:
    id: meta/llama-3.1-8b-instruct
    endpoint: ${NIM_BASE_URL}
    max_tokens: 2048
    temperature: 0.0

  llama3_70b:
    id: meta/llama-3.1-70b-instruct
    endpoint: ${NIM_BASE_URL}
    max_tokens: 4096
    temperature: 0.0

  mistral_7b:
    id: mistralai/mistral-7b-instruct-v0.3
    endpoint: ${NIM_BASE_URL}
    max_tokens: 2048
    temperature: 0.0
