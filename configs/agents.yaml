agents:
  planner:
    model: meta/llama3-70b-instruct
    temperature: 0.0
    description: Decomposes user queries into ordered subtasks

  executor:
    model: meta/llama3-70b-instruct
    temperature: 0.0
    description: Dispatches subtasks to specialist agents

  reviewer:
    model: meta/llama3-70b-instruct
    temperature: 0.0
    description: Scores results and decides to loop or terminate
    pass_threshold: 0.8
    max_loops: 3

  api_agent:
    model: meta/llama3-8b-instruct
    temperature: 0.0
    description: Handles REST API data fetching tasks

  sql_agent:
    model: meta/llama3-70b-instruct
    temperature: 0.0
    description: Handles text-to-SQL database queries

  doc_agent:
    model: meta/llama3-70b-instruct
    temperature: 0.0
    description: Handles document store semantic retrieval
