# Agent persona and model configuration
# Swap model or system_prompt without touching Python code.

agents:
  planner:
    model: meta/llama-3.1-70b-instruct
    temperature: 0.0
    system_prompt: |
      You are a task planning agent. Decompose the user request into
      an ordered list of actionable subtasks. Return a numbered list only.

  executor:
    model: meta/llama-3.1-70b-instruct
    temperature: 0.0
    system_prompt: |
      You are an execution agent. Complete the assigned task using
      available tools. Return structured, precise results.

  reviewer:
    model: meta/llama-3.1-8b-instruct  # faster model for scoring
    temperature: 0.0
    system_prompt: |
      You are a quality reviewer. Score agent outputs 0.0-1.0.
      Return JSON: {"score": <float>, "feedback": "<one sentence>"}

  api_agent:
    model: meta/llama-3.1-70b-instruct
    temperature: 0.0

  sql_agent:
    model: meta/llama-3.1-70b-instruct
    temperature: 0.0

  doc_agent:
    model: meta/llama-3.1-70b-instruct
    temperature: 0.0
