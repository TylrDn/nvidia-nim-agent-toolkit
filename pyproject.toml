[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nvidia-nim-agent-toolkit"
version = "0.1.0"
description = "Multi-agent coordination system powered by NVIDIA NIM inference microservices and LangGraph orchestration"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "chromadb>=0.5.0",
    "langfuse>=2.30.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pytest>=8.2.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
