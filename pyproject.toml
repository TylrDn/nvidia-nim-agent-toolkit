[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-nim-agent-toolkit"
version = "0.1.0"
description = "Multi-agent coordination system powered by NVIDIA NIM inference microservices and LangGraph orchestration"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-openai>=0.2,<0.3",
    "langgraph>=0.2,<0.3",
    "openai>=1.40,<2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "faiss-cpu>=1.8",
    "langfuse>=2.40,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
evals = ["langsmith>=0.1.30"]

[tool.setuptools]
packages = ["nim", "orchestrator", "orchestrator.nodes", "agents", "tools", "configs", "core", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live NIM endpoint (skipped by default)",
]

[tool.coverage.run]
source = ["nim", "orchestrator", "agents", "tools", "configs", "core", "api"]
omit = ["*/__init__.py", "tests/*"]
