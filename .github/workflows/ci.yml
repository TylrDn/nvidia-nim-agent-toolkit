name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy orchestrator/ agents/ nim/ tools/ --ignore-missing-imports

      - name: Run tests
        env:
          NIM_BASE_URL: https://fake-nim.example.com/v1
          NIM_API_KEY: test-key
          NIM_DEFAULT_MODEL: meta/llama3-70b-instruct
        run: pytest tests/ -v
