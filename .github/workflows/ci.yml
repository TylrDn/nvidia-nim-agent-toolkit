name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      NIM_API_KEY: test-key
      NIM_BASE_URL: https://nim.test/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy nim/ orchestrator/ agents/ tools/ api/ configs/ core/ --ignore-missing-imports

      - name: Test (pytest)
        run: pytest tests/ -m "not integration" --cov --cov-report=term-missing --cov-fail-under=80
