# Root developer-convenience compose.
#
#   docker compose --profile dev up   → orchestrator only, cloud NIM via .env
#   docker compose --profile full up  → also starts a local GPU NIM service
#
# The orchestrator runs under both profiles; the GPU `nim` service is opt-in.
services:
  orchestrator:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: nim-agent-orchestrator
    profiles: [dev, full]
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nim:
    image: nvcr.io/nim/meta/llama-3.1-8b-instruct:latest
    container_name: nim-llama3
    profiles: [full]
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NIM_MODEL_NAME=meta/llama-3.1-8b-instruct
    volumes:
      - nim-cache:/root/.cache/nim
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  nim-cache:
