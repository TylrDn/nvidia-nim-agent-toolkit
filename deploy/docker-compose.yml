version: "3.9"

services:
  nim-agent-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: nvidia-nim-agent-toolkit:latest
    container_name: nim-agent-api
    env_file: ../.env
    ports:
      - "8080:8080"
    environment:
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./demo.db}
      - FAISS_INDEX_PATH=/app/faiss_index
    volumes:
      - faiss_data:/app/faiss_index
      - ./demo.db:/app/demo.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  faiss_data:
