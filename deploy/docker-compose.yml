version: "3.9"

services:
  agent-toolkit:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nim-agent-toolkit
    env_file:
      - ../.env
    environment:
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_DEFAULT_MODEL=${NIM_DEFAULT_MODEL:-meta/llama-3.1-70b-instruct}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./demo.db}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-pgvector}
      - PGVECTOR_URL=${PGVECTOR_URL:-postgresql://postgres:password@pgvector:5432/vectordb}
    ports:
      - "8080:8080"
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: nim-pgvector
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgvector_data:
    driver: local
